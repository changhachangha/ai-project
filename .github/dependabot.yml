version: 2
updates:
    # npm 의존성 — 매주 월요일 09:00 (KST) 점검
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
          day: monday
          time: '09:00'
          timezone: Asia/Seoul
      open-pull-requests-limit: 5
      labels:
          - dependencies
      commit-message:
          prefix: 'chore(deps)'
      groups:
          # minor/patch 는 하나의 PR로 묶어 노이즈를 줄인다
          minor-and-patch:
              patterns:
                  - '*'
              update-types:
                  - minor
                  - patch

    # GitHub Actions 버전 — 매월 점검
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: monthly
      labels:
          - dependencies
          - ci
      commit-message:
          prefix: 'chore(ci)'
